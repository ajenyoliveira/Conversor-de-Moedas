
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Conversor de Moedas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>

<body>

    <main class="container">

        <header class="header">
            <div class="icon-money">💱</div>
            <h1>Conversor de Moedas</h1>
            <p>Converta moedas de forma rápida e simples.</p>
        </header>

        <form class="converter-form" id="converterForm">

            <div class="currency-row">

                <div class="currency-input">
                    <label for="amount">Valor</label>
                    <input
                        type="number"
                        id="amount"
                        placeholder="Digite o valor"
                        min="0.01"
                        step="0.01"
                        required
                    >
                </div>

                <div class="currency-select">
                    <label for="fromCurrency">De</label>
                    <select id="fromCurrency">
                        <option value="USD">USD - Dólar</option>
                        <option value="EUR">EUR - Euro</option>
                        <option value="BRL" selected>BRL - Real</option>
                        <option value="GBP">GBP - Libra</option>
                        <option value="JPY">JPY - Iene</option>
                        <option value="CAD">CAD - Dólar Canadense</option>
                        <option value="AUD">AUD - Dólar Australiano</option>
                        <option value="CHF">CHF - Franco Suíço</option>
                        <option value="CNY">CNY - Yuan Chinês</option>
                        <option value="INR">INR - Rúpia Indiana</option>
                        <option value="RUB">RUB - Rublo Russo</option>
                        <option value="KRW">KRW - Won Sul-Coreano</option>
                        <option value="MXN">MXN - Peso Mexicano</option>
                        <option value="COP">COP - Peso Colombiano</option>
                        <option value="ARS">ARS - Peso Argentino</option>
                    </select>
                </div>

            </div>

            <div class="currency-row">

                <div class="currency-select full-width">
                    <label for="toCurrency">Para</label>
                    <select id="toCurrency">
                        <option value="USD">USD - Dólar</option>
                        <option value="EUR">EUR - Euro</option>
                        <option value="BRL">BRL - Real</option>
                        <option value="GBP">GBP - Libra</option>
                        <option value="JPY">JPY - Iene</option>
                        <option value="CAD">CAD - Dólar Canadense</option>
                        <option value="AUD">AUD - Dólar Australiano</option>
                        <option value="CHF">CHF - Franco Suíço</option>
                        <option value="CNY">CNY - Yuan Chinês</option>
                        <option value="INR">INR - Rúpia Indiana</option>
                        <option value="RUB">RUB - Rublo Russo</option>
                        <option value="KRW">KRW - Won Sul-Coreano</option>
                        <option value="MXN">MXN - Peso Mexicano</option>
                        <option value="COP">COP - Peso Colombiano</option>
                        <option value="ARS">ARS - Peso Argentino</option>
                    </select>
                </div>

            </div>

            <div class="result-box">
                <label for="result">Resultado da conversão</label>
                <input
                    type="text"
                    id="result"
                    placeholder="O resultado aparecerá aqui"
                    readonly
                >
            </div>

            <button type="submit" class="convert-btn" id="converterBtn">
                💰 Converter Moeda
            </button>

            <div class="loading" id="loading" hidden>
                <div class="spinner"></div>
                <p>Buscando cotação...</p>
            </div>

            <div
                class="result-message"
                id="resultMessage"
                role="status"
                aria-live="polite"
            ></div>

        </form>

        <footer class="info">
            <p>🌎 Conversor de moedas</p>
            <p>Consulte taxas de câmbio atualizadas.</p>
            <p>
                Cotações fornecidas por
                <a href="https://www.exchangerate-api.com/"
                   target="_blank"
                   rel="noopener noreferrer">
                    ExchangeRate-API
                </a>
            </p>
        </footer>

    </main>

</body>
</html>
